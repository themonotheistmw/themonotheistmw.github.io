name: Build The Monotheist Public APK

on:
  push:
    paths:
      - 'android/monotheist-public/**'
      - '.github/workflows/build-monotheist-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirm Android SDK
        run: test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms/android-35"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable preview APK
        working-directory: android/monotheist-public
        run: gradle :app:assembleDebug --no-daemon
      - name: Name APK
        run: cp android/monotheist-public/app/build/outputs/apk/debug/app-debug.apk The-Monotheist.apk
      - uses: actions/upload-artifact@v4
        with:
          name: The-Monotheist-Android
          path: The-Monotheist.apk
      - name: Publish public preview download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create monotheist-public-v0.1.0 The-Monotheist.apk --title "The Monotheist Android · Preview 0.1.0" --notes "Installable Android preview of the public reader. This build is debug-signed for testing. Future stable versions will use a persistent release signing key." --latest=false || gh release upload monotheist-public-v0.1.0 The-Monotheist.apk --clobber
