name: Build The Monotheist reader
on:
  workflow_dispatch:
  pull_request:
    paths: ['android-studio/**', '.github/workflows/build-monotheist-reader.yml']
  push:
    branches: [main]
    paths: ['android-studio/**', '.github/workflows/build-monotheist-reader.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle -p android-studio assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: The-Monotheist-MW-Android
          path: android-studio/app/build/outputs/apk/debug/app-debug.apk
