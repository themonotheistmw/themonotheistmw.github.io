name: Build The Monotheist reader
on:
  workflow_dispatch:
  pull_request:
    paths: ['android-studio/**', '.github/workflows/build-monotheist-reader.yml']
  push:
    branches: [main]
    paths: ['android-studio/**', '.github/workflows/build-monotheist-reader.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle -p android-studio assembleDebug --no-daemon
      - name: Check packaged texts and launcher icon
        run: |
          python3 - <<'PY'
          import gzip, json, pathlib, zipfile
          app = pathlib.Path("android-studio/app")
          with zipfile.ZipFile(app / "build/outputs/apk/debug/app-debug.apk") as apk:
              script = apk.read("assets/www/library-data.js")
              assert script == gzip.decompress((app / "catalog.js.gz").read_bytes())
              catalog = json.loads(script.decode().split("=", 1)[1].strip().rstrip(";"))
              assert len(catalog["writings"]) == 10 and len(catalog["books"]) == 11
              assert all(item.get("html") for group in ("writings", "books") for item in catalog[group])
              assert any(name.endswith("/ic_launcher.png") for name in apk.namelist())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: The-Monotheist-MW-Android
          path: android-studio/app/build/outputs/apk/debug/app-debug.apk
